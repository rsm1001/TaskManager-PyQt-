[project]
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.4.0",
    "PyQt6-Qt6>=6.4.0",
    "PyQt6-sip>=13.4.0",
    "SQLAlchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.mypy]
python_version = "3.8"
files = [
    "models/model.py",
    "managers/infrastructure/data_access.py",
    "managers/tasks/task_orchestrator.py",
    "managers/tasks/priority.py",
    "managers/tasks/task_type.py",
    "services/domain/statistics_service.py",
    "services/factories/service_factory.py",
    "managers/application/data_manager.py",
    "services/application/window_task_operations.py",
    "services/application/task_operations/todo_operations.py",
    "services/application/task_operations/entertainment_operations.py",
    "services/application/task_operations/shortcut_operations.py",
]
follow_imports = "skip"
show_error_codes = true
pretty = true
no_color_output = false
warn_return_any = false
warn_unused_ignores = true

# 排除 UI / GUI / handlers / 未注解的遗留层
exclude = [
    "main.py",
    "ui/",
    "dialogs/",
    "components/",
    "widgets/",
    "demos/",
    "launch.py",
    "handlers/",
]

# 逐文件精确配置
[[tool.mypy.overrides]]
# 已添加完整类型注解的核心文件：严格检查（不含 data_manager，因其依赖大量未注解模块）
module = [
    "models.model",
    "managers.infrastructure.data_access",
    "managers.tasks.task_orchestrator",
    "managers.tasks.priority",
    "managers.tasks.task_type",
    "services.domain.statistics_service",
    "services.factories.service_factory",
]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# data_manager 包含大量未注解的 orchestrator 依赖，启用宽松检查
module = ["managers.application.data_manager"]
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
# 未注解的遗留 manager / service 文件：跳过检查
module = [
    "managers.trash.trash_manager",
    "managers.tasks.daily_task_manager",
    "managers.tasks.todo_task_manager",
    "managers.tasks.entertainment_task_manager",
    "managers.configuration.config_manager",
    "managers.shortcuts.shortcut_manager",
    "managers.tags.tag_manager",
    "managers.tags.tag_orchestrator",
    "managers.shortcuts.shortcut_orchestrator",
    "managers.trash.trash_orchestrator",
    "managers.configuration.config_orchestrator",
    "services.factories.orchestrator_factory",
    "services.domain.trash_restoration_service",
    "services.domain.daily_reset_service",
    "services.application.table_operations",
    "services.application.window_task_operations",
    "services.application.task_ops_todo",
    "services.application.task_ops_entertainment",
    "services.application.task_ops_shortcuts",
    "services.application.data_loaders",
    "services.pomodoro.pomodoro_service",
    "services.search.search_service",
    "services.domain.task_limit_service",
    "services.shortcuts.shortcut_operation_service",
    "services.domain.tag_cleanup_service",
    "services.domain.random_task_service",
    "services.domain.vacuum_service",
    "services.search.search_coordinator",
]
